name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev
      - name: Install SBCL (enables the live-REPL tests)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) sudo apt-get install -y sbcl ;;
            macOS) brew install sbcl ;;
            Windows) choco install sbcl -y ;;
          esac
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast
      - run: cargo build --release --workspace
