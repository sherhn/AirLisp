name: Release

# Push a tag `vX.Y.Z` (the version in Cargo.toml) to publish a GitHub release.
# `vX.Y.Z-rc1` makes a pre-release. Run by hand (workflow_dispatch) to only build the archives.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          [ "${tag%%-*}" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev
      - name: Install SBCL (it is bundled into the archive)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) sudo apt-get install -y sbcl ;;
            macOS) brew install sbcl ;;
            Windows) choco install sbcl -y ;;
          esac
      - name: Build the archive
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: air-${{ runner.os }}
          path: |
            target/dist/*.zip
            target/dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--generate-notes)
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --title "Air ${GITHUB_REF_NAME#v}" "${flags[@]}"
