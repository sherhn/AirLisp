[package]
name = "lispcraft"
description = "Lispcraft - a JetBrains-style IDE for Lisp"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lispcraft"
path = "src/main.rs"

[dependencies]
lisp-syntax.workspace = true
ide-core.workspace = true
lisp-runtime.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = "0.17"
serde_json.workspace = true
png = "0.18"
