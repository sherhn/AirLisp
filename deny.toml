# Dependency policy, checked with `cargo deny check` (https://github.com/EmbarkStudios/cargo-deny)
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "BSL-1.0", "OFL-1.1", "Ubuntu-font-1.0", "LicenseRef-UFL-1.0", "0BSD", "NCSA"]
